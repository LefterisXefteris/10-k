name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q --ignore=tests/test_dag.py

  dag:
    name: DAG parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow and test dependencies
        run: |
          pip install "apache-airflow==2.10.5" pytest pyarrow requests --constraint \
            https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
      - name: Parse DAG
        run: pytest -q tests/test_dag.py

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose and build images
        run: |
          docker compose config
          docker build -f api/Dockerfile api
          docker build -f airflow/Dockerfile airflow
